services:
  backend:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure a production secret}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Configure the public host},backend,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:?Configure the HTTPS origin}
      PUBLIC_URL: ${PUBLIC_URL}
      TRUST_PROXY: 'true'
      AUTH_TRUST_PROXY_IP: 'true'
      SECURE_SSL_REDIRECT: 'true'
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:?Configure SMTP}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: 'true'
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Configure the sender}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/session/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r)"]
  frontend:
    restart: unless-stopped
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a database password}
  redis:
    restart: unless-stopped
