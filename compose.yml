services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workboard
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workboard-local}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workboard -d workboard]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-container}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://workboard:${POSTGRES_PASSWORD:-workboard-local}@db:5432/workboard
      REDIS_URL: redis://redis:6379/0
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      PUBLIC_URL: http://localhost:8080
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [media_data:/app/media, static_data:/app/staticfiles]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session/')"]
      interval: 10s
      start_period: 30s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['8080:80']
    volumes: [static_data:/staticfiles:ro]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
